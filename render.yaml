services:
  - type: web
    name: devforge-student-support-ai
    runtime: python

    buildCommand: |
      pip install -r requirements.txt

    startCommand: |
      uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: OLLAMAAPIKEY
        sync: false

      - key: OLLAMA_MODEL
        value: gpt-oss:20b-cloud